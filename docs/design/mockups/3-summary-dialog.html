<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan summary dialog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: rgba(20, 20, 20, 0.45); color: #0b0b0b; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; line-height: 1.45">
  <div role="dialog" aria-labelledby="summary-title" style="width: 720px; box-sizing: border-box; padding: 20px 22px 22px; background: #ffffff; border: 1px solid #0b0b0b">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px">
      <h2 id="summary-title" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.1">Plan summary</h2>
      <button type="button" aria-label="Close" style="min-height: 32px; padding: 0 12px; background: #ffffff; border: 1px solid #0b0b0b; font-size: 12.5px">Close</button>
    </div>
    <textarea readonly rows="22" aria-label="Plan summary text" style="width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #0b0b0b; background: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5; resize: vertical">My plan: Business Analytics, section TXA
Nova SBE MSc, Fall 2026/27

ELECTIVES (4)
- Applied Entrepreneurship [2421], section TXA, S1, 7 ECTS
  Classes: Fri 08:00–11:00 (B004)
- Competition Policy [2128], section TXA, T1, 3.5 ECTS
  Classes: Thu 08:00–11:00 (D-105)
- Customer Relationship Management [2389], section TXA, T1, 3.5 ECTS
  Classes: Mon 08:00–11:00 (D-104)
- Quality Management [2352], section TXA, T1, 3.5 ECTS
  Classes: Tue 18:30–20:00 (D-104); Thu 18:30–20:00 (D-104)

MANDATORY COURSES (3)
- Digital Strategy and Markets [2762], section TXA, T1, 3.5 ECTS
  Classes: Wed 11:00–14:00 (B002)
- Introduction to Python for Data Analysis [2766], section TXA, T1, 3.5 ECTS
  Classes: Mon 09:30–12:30 (D-106)
- Research Methods for Business Analytics [2771], section TXA, T1, 3.5 ECTS
  Classes: Tue 11:00–14:00 (B002)

ECTS: 28 this semester (T1 courses 21, T2 courses 0, S1 courses 7)</textarea>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px">
      <span role="status" style="font-size: 12.5px">✓ Copied to clipboard.</span>
      <button type="button" style="min-height: 44px; padding: 0 22px; background: #002fa7; border: 1px solid #002fa7; color: #ffffff; font-weight: 500">Copy to clipboard</button>
    </div>
  </div>
</div>
</body>
</html>
